name: CI Pipeline

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:

  # 🧪 SQL LINT
  sql-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Lint SQL
        run: sqlfluff lint car_rental_db --dialect postgres

  # ☕ BACKEND (JAVA 21)
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Backend
        run: |
          cd car_rental
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: car_rental/target/*.jar

  # 🌐 FRONTEND
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('vad-front-app/package-lock.json') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd vad-front-app
          npm install
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vad-front-app/dist

  # 🤖 PYTHON
  python-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [password_check, suspicious]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('vehicule_ai/**/requirements.txt') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          cd vehicule_ai/${{ matrix.service }}
          pip install -r requirements.txt

      - name: Basic Check
        run: |
          cd vehicule_ai/${{ matrix.service }}
          python -c "print('Service OK')"

  # 🔎 SONARCLOUD
  sonar:
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build, python-build ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Download backend artifact
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: car_rental/target

      # 🔎 Sonar scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_VAD }}