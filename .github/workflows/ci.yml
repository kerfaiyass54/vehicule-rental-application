name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 🧪 SQL LINT
  sql-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Lint SQL
        run: sqlfluff lint car_rental_db --dialect postgres

  # ☕ ACCOUNT SERVICE (JAVA 21)
  account-service-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-account-${{ runner.os }}-${{ hashFiles('account_service/pom.xml') }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Account Service
        run: mvn -f account_service/pom.xml clean package -DskipTests

      - name: Upload Account Service Artifact
        uses: actions/upload-artifact@v4
        with:
          name: account-service-jar
          path: account_service/target/*.jar

  # ☕ CAR RENTAL (JAVA 21)
  car-rental-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-car-rental-${{ runner.os }}-${{ hashFiles('car_rental/pom.xml') }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Car Rental
        run: |
          cd car_rental
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Upload Car Rental Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-rental-jar
          path: car_rental/target/*.jar

  # 🌐 FRONTEND
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Node
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ hashFiles('vad-front-app/package-lock.json') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd vad-front-app
          npm install
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vad-front-app/dist

  # 🤖 PYTHON
  python-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ password_check, suspicious, budget_service ]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('**/requirements.txt') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          if [ "${{ matrix.service }}" == "budget_service" ]; then
            pip install -r budget_service/requirements.txt
          else
            pip install -r vehicule_ai/${{ matrix.service }}/requirements.txt
          fi

      - name: Basic Check
        run: |
          echo "Service ${{ matrix.service }} OK"

  # 🔎 SONARCLOUD
  sonar:
    runs-on: ubuntu-latest
    needs: [ account-service-build, car-rental-build, frontend-build, python-build ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_VAD }}