<div class="page-wrapper">

  <div class="wizard-header">

    <div class="wizard-icon">📦</div>

    <div>
      <h1>Create Category</h1>
      <p>Register a new vehicle category in inventory</p>
    </div>

  </div>


  <div class="wizard-container">

    <mat-horizontal-stepper linear>

      <!-- STEP 1 -->

      <mat-step [stepControl]="categoryForm">

        <form [formGroup]="categoryForm">

          <ng-template matStepLabel>Category Details</ng-template>

          <div class="form-grid">

            <mat-form-field appearance="outline">

              <mat-label>Category Name</mat-label>

              <mat-select formControlName="nameCategory">

                <mat-option
                  *ngFor="let name of categoryNames"
                  [value]="name">

                  {{ name }}

                </mat-option>

              </mat-select>

            </mat-form-field>


            <mat-form-field appearance="outline">

              <mat-label>Category Type</mat-label>

              <input
                matInput
                placeholder="Example: SUV"
                formControlName="typeCategory">

            </mat-form-field>

          </div>


          <div class="step-actions">

            <button
              mat-raised-button
              color="primary"
              matStepperNext
              [disabled]="categoryForm.invalid">

              Continue

            </button>


            <button
              mat-stroked-button
              color="warn"
              (click)="cancel()">

              Cancel

            </button>

          </div>

        </form>

      </mat-step>



      <!-- STEP 2 -->

      <mat-step [stepControl]="stockForm">

        <form [formGroup]="stockForm">

          <ng-template matStepLabel>Stock Setup</ng-template>

          <div class="form-grid">

            <mat-form-field appearance="outline">

              <mat-label>Stock Quantity</mat-label>

              <input
                matInput
                type="number"
                formControlName="stock">

            </mat-form-field>

          </div>


          <div class="step-actions">

            <button mat-stroked-button matStepperPrevious>

              Back

            </button>


            <button
              mat-raised-button
              color="primary"
              matStepperNext
              [disabled]="stockForm.invalid">

              Review

            </button>


            <button
              mat-stroked-button
              color="warn"
              (click)="cancel()">

              Cancel

            </button>

          </div>

        </form>

      </mat-step>



      <!-- STEP 3 REVIEW -->

      <mat-step>

        <ng-template matStepLabel>Review</ng-template>

        <div class="review-box">

          <p>
            <strong>Name:</strong>
            {{ categoryForm.value.nameCategory }}
          </p>


          <p>
            <strong>Type:</strong>
            {{ categoryForm.value.typeCategory }}
          </p>


          <p>
            <strong>Stock:</strong>
            {{ stockForm.value.stock }}
          </p>

        </div>


        <div class="step-actions">

          <button mat-stroked-button matStepperPrevious>

            Back

          </button>


          <button
            mat-raised-button
            color="primary"
            (click)="submit()">

            Create Category

          </button>


          <button
            mat-stroked-button
            color="warn"
            (click)="cancel()">

            Cancel

          </button>

        </div>

      </mat-step>

    </mat-horizontal-stepper>

  </div>

</div>
