<h2 mat-dialog-title>Supplier Countries</h2>

<mat-dialog-content>

  <div class="flags-grid">

    <div
      class="flag-card"
      *ngFor="let country of countries">

      <div class="flag">

        {{ getFlag(country) }}

      </div>

      <div class="country-name">

        {{ country }}

      </div>

    </div>

  </div>

</mat-dialog-content>
