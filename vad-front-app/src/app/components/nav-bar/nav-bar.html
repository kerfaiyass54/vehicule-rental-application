<mat-toolbar class="navbar">

  <!-- Brand -->
  <div class="navbar-brand">
    <mat-icon class="brand-icon">{{ brandIcon }}</mat-icon>
    <a class="brand-name"  routerLink="/{{role}}">{{ brandName }}</a>
  </div>

  <mat-divider vertical class="divider"></mat-divider>

  <!-- Nav links -->
  <nav class="nav-links">
    @for (item of navItems; track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: item.link === '/' }"
        class="nav-link"
        [matTooltip]="item.label"
        matTooltipPosition="below"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- User info -->
  @if (username) {
    <div class="user-info">
      <mat-icon class="user-icon">account_circle</mat-icon>
      <a class="username" routerLink="/{{role}}/details">{{ username }}</a>
    </div>
  }

  <!-- Logout -->
  <button mat-stroked-button class="logout-btn" (click)="openLogoutDialog()">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>

</mat-toolbar>
